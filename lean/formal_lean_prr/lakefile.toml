name = "formal_prr"
version = "0.2.0"
keywords = ["math"]
# The paper's build target is FormalPRR only.  The companion library
# FormalPRRCompanion (kernels of a separate manuscript) is NOT a default
# target: build it explicitly with `lake build FormalPRRCompanion`.
defaultTargets = [
  "FormalPRR",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "FormalPRR"

[[lean_lib]]
name = "FormalPRRCompanion"
