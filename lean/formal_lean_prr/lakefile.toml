name = "formal_prr"
version = "0.1.0"
keywords = ["math"]
defaultTargets = [
  "FormalPRR",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "FormalPRR"
